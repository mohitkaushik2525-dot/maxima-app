<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAXIMA Staff</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAXIMA">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0a0a0a;--line:#2a2a2a;--muted:#a8a49c;--gold:#d9b25a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#f4f2ee;font-family:Poppins,system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#frame{flex:1;border:0;width:100%;background:var(--bg)}
nav{display:flex;justify-content:center;background:#0f0f0f;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:transparent;border:0;color:var(--muted);padding:10px 4px 12px;font-size:11px;font-weight:600;letter-spacing:.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .em{font-size:20px;line-height:22px}
nav button.on{color:var(--gold)}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;transition:opacity .4s}
#splash .logo{border:3px solid #fff;padding:10px 26px;font-size:30px;font-weight:300;letter-spacing:9px}
#splash .pill{border:1.5px solid var(--gold);color:var(--gold);border-radius:999px;padding:5px 14px;font-size:11px;letter-spacing:3px}
#splash.hide{opacity:0;pointer-events:none}
</style></head><body>
<div id="splash"><div class="logo">MAXIMA</div><div class="pill">STAFF APP</div><div style="color:var(--muted);font-size:13px">Loading…</div></div>
<div id="app">
<div id="frames" style="flex:1;position:relative;background:var(--bg)"></div>
<nav><div class="in">
<button data-p="" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
<button data-p="order"><svg viewBox="0 0 24 24"><path d="M4 4h16v6a8 8 0 0 1-16 0z"/><path d="M8 4V2M12 4V2M16 4V2M2 20h20"/></svg>Order</button>
<button data-p="fb"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z"/></svg>Feedback</button>
<button data-p="diwali"><span class="em">🎉</span>Party</button>
<button data-p="manager"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Manager</button>
</div></nav>
</div>
<script>
const BASE='https://script.google.com/macros/s/AKfycbwYJ6ErkZAJgtX8V5ApYP7b_cVnx9Dy4p4Qgo1ZvFMGRy4KY7WY9NsIU8yi1uDTRRdlkQ/exec';
const box=document.getElementById('frames'),nav=document.querySelector('nav'),F={};
let ID=null;try{ID=JSON.parse(localStorage.getItem('mx_id')||'null')}catch(e){}
const idq=()=>ID&&ID.me&&ID.tk?'&me='+encodeURIComponent(ID.me)+'&tk='+encodeURIComponent(ID.tk):'';
function frame(p){if(F[p])return F[p];const f=document.createElement('iframe');f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#0a0a0a';f.allow='clipboard-write';f.src=BASE+'?app=1'+(p?'&p='+p:'')+idq();f.addEventListener('load',()=>document.getElementById('splash').classList.add('hide'));box.appendChild(f);F[p]=f;return f;}
window.addEventListener('message',e=>{const d=e.data;if(!d||d.maxima!==1||!d.me||!d.tk)return;if(ID&&ID.me===d.me&&ID.tk===d.tk)return;ID={me:d.me,tk:d.tk};try{localStorage.setItem('mx_id',JSON.stringify(ID))}catch(x){}
Object.keys(F).forEach(p=>{if(F[p].style.display==='none'){F[p].src=BASE+'?app=1'+(p?'&p='+p:'')+idq();}});});
function go(p){const f=frame(p);Object.values(F).forEach(x=>x.style.display='none');f.style.display='block';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));try{localStorage.setItem('mx_tab',p)}catch(e){}}
nav.onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.p);};
let start='';try{start=localStorage.getItem('mx_tab')||''}catch(e){}
if(['','order','fb','diwali','manager'].indexOf(start)<0)start='';
go(start);
setTimeout(()=>{['','order','fb','diwali'].forEach(p=>frame(p));},4000);
setTimeout(()=>document.getElementById('splash').classList.add('hide'),6000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
